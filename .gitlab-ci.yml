# GitLab CI for Bilingual Subtitle Suite (biss).
#
# Port of .github/workflows/release.yml to the self-hosted GitLab runners:
#   linux    -> Kubernetes executor on the cluster (unit tests, release)
#   windows  -> shell runner on the Windows laptop (biss.exe lite build and
#               biss-full.exe with bundled PGSRip + Tesseract data)
#
# Runs on version tags and when started from the web UI / API (never on
# plain pushes, so the laptop runner is not woken for every commit). Set
# RELEASE_VERSION=v1.2.3 on a manual run of that tag to publish (or
# re-publish) its release. The Windows jobs bootstrap their own Python 3.11
# + Tk the first time under the runner's tools directory (ci/tools-windows.ps1),
# so nothing has to be pre-installed.
#
# GitHub Actions is disabled for this project; releases are built and
# published here only. .github/workflows/release.yml is kept for reference.
#
# Artifact size: biss-full.exe (about 100-110 MB, most of it Tesseract
# data) is over GitLab's default 100 MB maximum job artifact size, which
# this instance does not raise, so it is never a job artifact. On release
# runs build-windows-full uploads it straight to the Generic Package
# Registry (ci/publish-windows.ps1) and the release job links it; untagged
# runs build and check it but do not keep it. biss.exe (about 20 MB) is a
# normal job artifact, and the release job uploads it.

stages: [test, build, release]

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"

variables:
  GIT_DEPTH: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_ROOT_USER_ACTION: ignore

# ───────────────────────────── shared pieces ─────────────────────────────

.version: &version
  # v1.2.3 -> 1.2.3; untagged runs get a valid semver prerelease.
  - |
    if [ -n "$RELEASE_VERSION" ]; then VERSION="${RELEASE_VERSION#v}"; elif [ -n "$CI_COMMIT_TAG" ]; then VERSION="${CI_COMMIT_TAG#v}"; else VERSION="0.0.0-${CI_COMMIT_SHORT_SHA}"; fi
    echo "App version: $VERSION"

.version_ps: &version_ps
  - |
    if ($env:RELEASE_VERSION) { $env:VERSION = $env:RELEASE_VERSION -replace '^v','' } elseif ($env:CI_COMMIT_TAG) { $env:VERSION = $env:CI_COMMIT_TAG -replace '^v','' } else { $env:VERSION = "0.0.0-$env:CI_COMMIT_SHORT_SHA" }
    Write-Host "App version: $env:VERSION"

.linux:
  tags: [linux]
  interruptible: true

.windows:
  tags: [windows]
  interruptible: true
  variables:
    GIT_STRATEGY: fetch
  before_script:
    - . .\ci\tools-windows.ps1
    - *version_ps
    - python -m venv .venv-ci
    - .\.venv-ci\Scripts\python.exe -m pip install -q -r ci\requirements-build.txt

# ───────────────────────────── tests (gate) ─────────────────────────────

# The unit tests (python -m unittest discover -s tests) on Python 3.11, the
# version the exes are built with. The GUI tests need a display, so they run
# under Xvfb (they would be skipped without one); libxcursor1 lets the tkdnd
# drag-and-drop smoke test load instead of skipping.
test:
  extends: .linux
  stage: test
  image: python:3.11
  variables:
    DEBIAN_FRONTEND: noninteractive
    PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
  cache:
    key: pip-py311
    paths: [.cache/pip/]
  script:
    - *version
    # A manual RELEASE_VERSION run must be started on that tag; refuse here,
    # before the Windows laptop spends two builds on the wrong ref (the
    # jobs that publish re-check the tag before uploading).
    - |
      if [ -n "$RELEASE_VERSION" ] && [ "$CI_COMMIT_TAG" != "v${RELEASE_VERSION#v}" ]; then
        echo "RELEASE_VERSION=$RELEASE_VERSION but this pipeline runs on '${CI_COMMIT_TAG:-$CI_COMMIT_REF_NAME}'. Run it on the tag v${RELEASE_VERSION#v}."; exit 1
      fi
    # Release builds must carry the release's version inside the app
    # (biss --version, GUI title, interactive menu read APP_VERSION) and have
    # a CHANGELOG entry. Untagged 0.0.0-<sha> builds are not checked.
    - |
      case "$VERSION" in
        0.0.0-*) echo "untagged build; skipping version check" ;;
        *) APP_VERSION=$(python -c "from utils.constants import APP_VERSION; print(APP_VERSION)")
           [ "$APP_VERSION" = "$VERSION" ] || { echo "APP_VERSION in utils/constants.py is $APP_VERSION but this release is $VERSION: bump it first"; exit 1; }
           # Fixed-string match at the start of a line (dots are not wildcards).
           awk -v h="## [$VERSION]" 'index($0, h) == 1 { found = 1 } END { exit !found }' CHANGELOG.md || { echo "CHANGELOG.md has no '## [$VERSION]' entry"; exit 1; } ;;
      esac
    - apt-get update -qq && apt-get install -y -qq xvfb xauth libxcursor1 >/dev/null
    - python -c "import tkinter; print('Tk', tkinter.TkVersion)"
    - pip install -q -r ci/requirements-build.txt
    - xvfb-run -a python -m unittest discover -s tests

# ───────────────────────────── Windows ─────────────────────────────

# Lite build (dist\biss.exe): everything except PGS OCR. Same command as the
# GitHub workflow's build-lite job.
build-windows-lite:
  extends: .windows
  stage: build
  needs: [test]
  script:
    - .\.venv-ci\Scripts\python.exe build.py --lite
    - .\ci\check-exe.ps1 -Exe dist\biss.exe -MinMB 10 -Version $env:VERSION
    - |
      New-Item -ItemType Directory -Force out | Out-Null
      Copy-Item dist\biss.exe out\ -Force
      Get-ChildItem out
  artifacts:
    name: biss-lite-$CI_COMMIT_SHORT_SHA
    paths: [out/biss.exe]
    expire_in: 30 days

# Full build (dist\biss-full.exe): adds PGSRip and the eng, chi_sim, chi_tra,
# jpn and kor Tesseract data (pinned, SHA-256 checked, cached on the runner).
# Same command as the GitHub workflow's build-full job. On release runs it
# publishes the exe itself (see the header).
build-windows-full:
  extends: .windows
  stage: build
  needs: [test]
  # Not interruptible: release runs upload to the package registry from
  # this job, and a cancel mid-upload would leave a partial release.
  interruptible: false
  script:
    - .\ci\prepare-full-windows.ps1 -Python .\.venv-ci\Scripts\python.exe
    - .\.venv-ci\Scripts\python.exe build.py --output-name biss-full
    - .\ci\check-exe.ps1 -Exe dist\biss-full.exe -MinMB 80 -Version $env:VERSION
    - |
      if ($env:CI_COMMIT_TAG -match '^v' -or $env:RELEASE_VERSION) {
        .\ci\publish-windows.ps1 -File dist\biss-full.exe
      } else {
        Write-Host "Not a release run: biss-full.exe was built and checked but is not kept (over the 100 MB job artifact limit)."
      }
  artifacts:
    name: biss-full-$CI_COMMIT_SHORT_SHA
    # Only the release link; the exe itself is left out (see the header).
    paths: [out/links.ndjson]
    expire_in: 30 days

# ───────────────────────────── release ─────────────────────────────

# Uploads biss.exe to the project's generic package registry (next to the
# biss-full.exe that build-windows-full published) and creates (or updates)
# the GitLab release for the version's tag with links to both.
release:
  extends: .linux
  stage: release
  image: alpine:3.20
  needs:
    - build-windows-lite
    - build-windows-full
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $RELEASE_VERSION
  # Never auto-cancel a half-finished publish.
  interruptible: false
  variables:
    GIT_STRATEGY: none
  script:
    - apk add --no-cache curl jq >/dev/null
    - |
      set -e
      VERSION="${RELEASE_VERSION:-$CI_COMMIT_TAG}"; VERSION="${VERSION#v}"; TAG="v$VERSION"
      # A manual RELEASE_VERSION run must be started on the tag itself, or it
      # would publish some other commit's builds under this tag. On a tag
      # pipeline CI_COMMIT_SHA is the tag's commit.
      [ "$CI_COMMIT_TAG" = "$TAG" ] || { echo "This pipeline runs on '${CI_COMMIT_TAG:-$CI_COMMIT_REF_NAME}', not the tag $TAG. Run it on the tag ref $TAG."; exit 1; }
      API="$CI_API_V4_URL/projects/$CI_PROJECT_ID"; H="JOB-TOKEN: $CI_JOB_TOKEN"
      PKG="$API/packages/generic/biss/$VERSION"
      ls -la out/
      test -f out/biss.exe || { echo "missing build: out/biss.exe"; exit 1; }
      test -s out/links.ndjson || { echo "build-windows-full did not publish biss-full.exe (out/links.ndjson missing)"; exit 1; }
      # Builds are not reproducible: never add a second, different biss.exe
      # under the same name (see ci/publish-windows.ps1).
      code=$(curl -sS -I -o /dev/null -w '%{http_code}' -H "$H" "$PKG/biss.exe" || true)
      case "$code" in
        200) echo "biss.exe is already in package biss/$VERSION. Publishing it again would add a second file with a different SHA-256 under the same name. Release a new patch version instead."; exit 1 ;;
        404) ;;
        *) echo "warning: could not check whether biss.exe is already published (HTTP '$code'); uploading." ;;
      esac
      echo "uploading biss.exe ($(du -h out/biss.exe | cut -f1))"
      curl -fsS --retry 3 -H "$H" --upload-file out/biss.exe "$PKG/biss.exe" >/dev/null
      # Link the API download URL (what the release mirror accepts), not the web one.
      { jq -cn --arg n biss.exe --arg u "$PKG/biss.exe" '{name:$n, url:$u, link_type:"package"}'; cat out/links.ndjson; } > links.ndjson
      ASSETS=$(jq -s -c . links.ndjson)
      NOTES=$(cat <<EOF
      ## Bilingual Subtitle Suite $TAG

      ### Downloads

      | File | Description | Approx. Size |
      |------|-------------|--------------|
      | **\`biss.exe\`** | Lite build — all features except PGS OCR | ~20 MB |
      | **\`biss-full.exe\`** | Full build — includes PGS OCR with bundled Tesseract data | ~110 MB |

      > **Which one should I download?**
      > Most users should start with **\`biss.exe\`** (lite). It handles subtitle merging, alignment, encoding conversion, batch processing, and the full GUI/CLI — everything except PGS image-based subtitle OCR. Download **\`biss-full.exe\`** only if you need to convert PGS (Blu-ray) subtitles to text.

      ### Bundled Tessdata (full build only)
      \`eng\`, \`chi_sim\`, \`chi_tra\`, \`jpn\`, \`kor\`

      ### Usage
      - **GUI**: Double-click the exe
      - **CLI**: \`biss.exe merge movie.mkv --output subs.srt\`
      - **Help**: \`biss.exe --help\`

      ### Requirements
      - Windows 10 or later
      - [FFmpeg](https://ffmpeg.org/download.html) on PATH (for video processing)
      - [MKVToolNix](https://mkvtoolnix.download/) on PATH (for MKV operations)
      - [Tesseract OCR](https://github.com/UB-Mannheim/tesseract/wiki) on PATH (**lite build only**, for PGS subtitle conversion)

      Built on GitLab CI.
      EOF
      )
      if curl -fsS -o /dev/null -H "$H" "$API/releases/$TAG" 2>/dev/null; then
        # Update in place: nothing is deleted. Existing links with the same
        # name are pointed at the new URL, new names are added.
        BODY=$(jq -cn --arg name "Bilingual Subtitle Suite $TAG" --arg desc "$NOTES" '{name:$name, description:$desc}')
        curl -fsS -X PUT -H "$H" -H "Content-Type: application/json" "$API/releases/$TAG" -d "$BODY" | jq -r '"updated release " + .tag_name'
        EXISTING=$(curl -fsS -H "$H" "$API/releases/$TAG/assets/links")
        while read -r l; do
          name=$(printf '%s' "$l" | jq -r '.name')
          id=$(printf '%s' "$EXISTING" | jq -r --arg n "$name" 'map(select(.name == $n)) | .[0].id // empty')
          if [ -n "$id" ]; then
            curl -fsS -X PUT -H "$H" -H "Content-Type: application/json" "$API/releases/$TAG/assets/links/$id" -d "$l" >/dev/null
            echo "  updated link $name"
          else
            curl -fsS -X POST -H "$H" -H "Content-Type: application/json" "$API/releases/$TAG/assets/links" -d "$l" >/dev/null
            echo "  added link $name"
          fi
        done < links.ndjson
      else
        BODY=$(jq -cn --arg tag "$TAG" --arg name "Bilingual Subtitle Suite $TAG" --arg desc "$NOTES" --argjson links "$ASSETS" '{tag_name:$tag, name:$name, description:$desc, assets:{links:$links}}')
        curl -fsS -X POST -H "$H" -H "Content-Type: application/json" "$API/releases" -d "$BODY" | jq -r '"created release " + .tag_name'
      fi
      echo "Published $TAG with:"; jq -r '.name' links.ndjson | sed 's/^/  /'
